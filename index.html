<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Application Scolaire</title>
    <link rel="stylesheet" href="style.css">
    <!-- On ajoute une police Google Fonts pour le côté moderne -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Le menu de gauche -->
    <div class="sidebar">
        <h2>🎓 Scolaris</h2>
        <ul>
            <li class="active">🏠 Tableau de bord</li>
            <li>📚 Mes cours</li>
            <li>📝 Mes notes</li>
            <li>💬 Messagerie</li>
        </ul>
    </div>

    <!-- La zone principale à droite -->
    <div class="main-content">
        <header>
            <h1>Bonjour, Élève ! 👋</h1>
            <p>Voici ton résumé pour aujourd'hui.</p>
        </header>

        <!-- Les petites cartes d'information -->
        <div class="cards-container">
            <div class="card">
                <h3>Moyenne Générale</h3>
                <p class="big-number">15.5/20</p>
            </div>
            <div class="card">
                <h3>Prochain contrôle</h3>
                <p>Maths - Vendredi</p>
            </div>
            <div class="card">
                <h3>Devoirs à faire</h3>
                <p>2 devoirs en attente</p>
            </div>
        </div>
    </div>

</body>
</html>
